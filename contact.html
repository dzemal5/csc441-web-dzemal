<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Class 16: Step 1: my contact page -->
    <title>Contact - Dzemal Crnkic</title>
    <!-- Class 12: Step 1: a typeface I chose-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="styles.css">
    <!-- Class 15: Step 1: my third file -->
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Class 13: Step 2: navigation -->
    <nav>
        <a href="index.html">Dzemal Crnkic</a>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="reading.html">Reading</a></li>
            <!-- Class 16: Step 1: the contact link -->
            <li><a href="contact.html" class="current">Contact</a></li>
            <!-- Class 15: Step 3: the theme button -->
            <li><button id="theme-toggle" type="button">Dark</button></li>
        </ul>
    </nav>
    <!-- Class 11 · Step 2: the page -->
    <header>
        <!-- Class 12: Step 3: an image -->
        <img src="images/me.jpg" alt="Portrait of Dzemal Crnkic" class="portrait">
        <!-- Lab 12 · Task 1: group the text so it stacks beside the photo -->
        <div class="header-text">
            <h1>Contact</h1>
            <p>Questions about the course, or something else</p>
        </div>
    </header>
    <main>
        <!-- Class 16: Step 2: a form -->
         <form id="contact-form">
            <p>
                <label for="name">Your name</label>
                <input id="name" name="name" type="text" required>
            </p>

            <p>
                <label for="email">Your email</label>
                <input id="email" name="email" type="email" required>
            </p>

            <p>
                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </p>

            <button type="submit">Send</button>
         </form>

         <p id="form-status" role="status"></p>
    </main>
    <footer>
        <!-- Lab 11 · Task 3: a link off my page -->
        <a href="https://github.com/dzemal5" target="_blank" rel="noopener">GitHub</a>
        <!-- Class 15: Step 2: the year, written by JavaScript -->
        <p>© <span id="year"></span> Dzemal Crnkic</p>
    </footer>
</body>

</html>
